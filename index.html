<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Baño y Enfermería - Escolar</title>
    <!-- Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <!-- Firebase SDKs (Compat v9) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        .student-card { transition: all 0.2s ease; }
        .student-card:hover { transform: translateY(-2px); }
    </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

    <div class="container mx-auto px-4 py-6 max-w-5xl">
        <!-- Encabezado -->
        <header class="bg-white shadow-md rounded-lg p-6 mb-6 flex flex-col md:flex-row justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-blue-900">Control de Baño y Enfermería</h1>
                <p class="text-sm text-gray-600">Colegio Pablo Guardado Chávez</p>
            </div>
            <div class="mt-4 md:mt-0 flex gap-2">
                <label class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded cursor-pointer text-sm font-medium shadow">
                    📁 Cargar JSON Horarios
                    <input type="file" id="jsonFileInput" accept=".json" class="hidden">
                </label>
                <label class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded cursor-pointer text-sm font-medium shadow">
                    📊 Cargar CSV Alumnos
                    <input type="file" id="csvFileInput" accept=".csv" class="hidden">
                </label>
            </div>
        </header>

        <!-- Panel de Configuración -->
        <div class="bg-white shadow-md rounded-lg p-6 mb-6 grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Docente:</label>
                <select id="teacherSelect" class="w-full border border-gray-300 rounded p-2 focus:ring focus:ring-blue-300">
                    <option value="">Seleccione docente...</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Grupo / Salón:</label>
                <select id="groupSelect" class="w-full border border-gray-300 rounded p-2 focus:ring focus:ring-blue-300">
                    <option value="">Seleccione grupo...</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Motivo de Salida:</label>
                <select id="motivoSelect" class="w-full border border-gray-300 rounded p-2 focus:ring focus:ring-blue-300">
                    <option value="Baño">Baño</option>
                    <option value="Enfermería">Enfermería</option>
                </select>
            </div>
        </div>

        <!-- Alerta de Alumno Fuera (Sincronizado con Firebase) -->
        <div id="statusAlert" class="hidden bg-yellow-50 border-l-4 border-yellow-400 p-4 mb-6 rounded shadow-sm flex justify-between items-center">
            <div>
                <span class="font-bold text-yellow-800">⚠️ Alumno actualmente fuera:</span>
                <span id="currentStudentOut" class="text-yellow-900 font-semibold ml-2"></span>
                <span id="currentMotivoOut" class="text-xs bg-yellow-200 text-yellow-800 px-2 py-0.5 rounded ml-2"></span>
            </div>
            <button id="returnBtn" class="bg-yellow-600 hover:bg-yellow-700 text-white px-4 py-1.5 rounded text-sm font-medium shadow">
                Registrar Regreso
            </button>
        </div>

        <!-- Cuadrícula de Alumnos -->
        <div class="bg-white shadow-md rounded-lg p-6">
            <h2 class="text-lg font-bold text-gray-800 mb-4 flex justify-between items-center">
                <span>Listado de Alumnos del Grupo</span>
                <span id="activeSubjectDisplay" class="text-sm font-normal bg-blue-100 text-blue-800 px-3 py-1 rounded-full">Materia: -</span>
            </h2>
            <div id="studentsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
                <p class="text-gray-500 col-span-full text-center py-8">Cargue el JSON de horarios, el CSV de alumnos y seleccione un grupo para comenzar.</p>
            </div>
        </div>
    </div>

    <!-- Script Principal Reestructurado -->
    <script>
        // --- CONFIGURACIÓN ---
        const firebaseConfig = {
            apiKey: "AIzaSyDHD2nqk6GKnMUq0YFQoX3DMzrePhtZuOc",
            authDomain: "quiero-wc.firebaseapp.com",
            databaseURL: "https://quiero-wc-default-rtdb.firebaseio.com",
            projectId: "quiero-wc",
            storageBucket: "quiero-wc.firebasestorage.app",
            messagingSenderId: "1009977439889",
            appId: "1:1009977439889:web:c36fa0869f4a5abb333130"
        };
        
        // Inicializar Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycby5sOTFkGyZ1KhiAeu75bk0Pb3e9oyqdyeR5f3pRB_7NlNLrfg_0l7I7EdTxghE5riV/exec";

        // Estado Global de la App
        let scheduleData = JSON.parse(localStorage.getItem('scheduleData')) || null;
        let studentsData = JSON.parse(localStorage.getItem('studentsData')) || [];
        let currentActiveStudent = null;

        // --- INICIO Y EVENT LISTENERS ---
        document.addEventListener('DOMContentLoaded', () => {
            if (scheduleData) {
                initSelectors();
            }
            setupFirebaseListener();

            // Eventos de carga de archivos
            document.getElementById('jsonFileInput').addEventListener('change', handleJSONUpload);
            document.getElementById('csvFileInput').addEventListener('change', handleCSVUpload);

            // Eventos de cambios en selectores
            document.getElementById('groupSelect').addEventListener('change', renderStudents);
            document.getElementById('teacherSelect').addEventListener('change', updateContext);
            document.getElementById('returnBtn').addEventListener('click', registerReturn);
        });

        // --- CARGA DE ARCHIVOS ---
        function handleJSONUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    scheduleData = JSON.parse(e.target.result);
                    localStorage.setItem('scheduleData', JSON.stringify(scheduleData));
                    alert("¡Horarios JSON cargados con éxito!");
                    initSelectors();
                } catch (err) {
                    alert("Error al leer el JSON de horarios.");
                    console.error(err);
                }
            };
            reader.readAsText(file);
        }

        function handleCSVUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const text = e.target.result;
                    const lines = text.split(/\r\n|\n/);
                    studentsData = [];
                    // Saltamos la cabecera (i = 1)
                    for (let i = 1; i < lines.length; i++) {
                        const line = lines[i].trim();
                        if (!line) continue;
                        const parts = line.split(',');
                        if (parts.length >= 2) {
                            studentsData.push({
                                name: parts[0].trim().replace(/^["']|["']$/g, ''),
                                group: parts[1].trim().replace(/^["']|["']$/g, '')
                            });
                        }
                    }
                    localStorage.setItem('studentsData', JSON.stringify(studentsData));
                    alert(`¡Se cargaron ${studentsData.length} alumnos correctamente!`);
                    renderStudents();
                } catch (err) {
                    alert("Error al procesar el archivo CSV.");
                    console.error(err);
                }
            };
            reader.readAsText(file);
        }

        // --- INICIALIZAR SELECTORES ---
        function initSelectors() {
            if (!scheduleData) return;
            
            const teacherSelect = document.getElementById('teacherSelect');
            teacherSelect.innerHTML = '<option value="">Seleccione docente...</option>';
            
            // Maestro Comodín
            let comodinOpt = document.createElement('option');
            comodinOpt.value = "COMODIN";
            comodinOpt.textContent = "⭐ MAESTRO COMODÍN (Actualización / Libre)";
            teacherSelect.appendChild(comodinOpt);

            // Docentes ordenados
            let teachers = [...scheduleData.teachers].sort((a, b) => a.name.localeCompare(b.name));
            teachers.forEach(t => {
                let opt = document.createElement('option');
                opt.value = t.id;
                opt.textContent = t.name;
                teacherSelect.appendChild(opt);
            });

            // Grupos
            const groupSelect = document.getElementById('groupSelect');
            groupSelect.innerHTML = '<option value="">Seleccione grupo...</option>';
            scheduleData.classes.forEach(c => {
                let opt = document.createElement('option');
                opt.value = c.name;
                opt.textContent = c.name;
                groupSelect.appendChild(opt);
            });

            autodetectCurrentClass();
        }

        function updateContext() {
            const teacherId = document.getElementById('teacherSelect').value;
            if (teacherId === "COMODIN") {
                document.getElementById('activeSubjectDisplay').textContent = "Materia: [Modo Comodín / Libre]";
            }
        }

        function autodetectionDayAndPeriod() {
            const now = new Date();
            const dayMap = { 1: "Lunes", 2: "Martes", 3: "Miercoles", 4: "Jueves", 5: "Viernes" };
            const currentDayName = dayMap[now.getDay()];
            const currentTimeVal = now.getHours() * 60 + now.getMinutes();

            let matchedPeriod = null;
            if (scheduleData && scheduleData.periods) {
                scheduleData.periods.forEach(p => {
                    let startVal = p.startHour * 60 + (p.startMinute || 0);
                    let endVal = p.endHour * 60 + (p.endMinute || 50);
                    if (currentTimeVal >= startVal && currentTimeVal <= endVal) {
                        matchedPeriod = p;
                    }
                });
            }
            return { dayName: currentDayName, period: matchedPeriod };
        }

        function autodetectCurrentClass() {
            const auto = autodetectionDayAndPeriod();
            if (!auto.dayName || !auto.period || !scheduleData) return;

            const dayObj = scheduleData.days.find(d => d.name === auto.dayName);
            if (!dayObj) return;

            for (let act of scheduleData.activities) {
                let card = act.cards.find(c => c.dayId === dayObj.id && c.periodId === auto.period.id);
                if (card) {
                    document.getElementById('teacherSelect').value = act.teacherIds[0];
                    updateContext();
                    break;
                }
            }
        }

        // --- RENDERIZAR CUADRÍCULA DE ALUMNOS ---
        function renderStudents() {
            const groupName = document.getElementById('groupSelect').value;
            const grid = document.getElementById('studentsGrid');
            grid.innerHTML = '';

            if (!groupName) {
                grid.innerHTML = '<p class="text-gray-500 col-span-full text-center py-8">Seleccione un grupo para ver los alumnos.</p>';
                return;
            }

            if (studentsData.length === 0) {
                grid.innerHTML = '<p class="text-red-500 col-span-full text-center py-8">⚠️ No hay datos de alumnos cargados. Por favor cargue el archivo CSV.</p>';
                return;
            }

            const filteredStudents = studentsData.filter(s => s.group === groupName);
            
            if (filteredStudents.length === 0) {
                grid.innerHTML = `<p class="text-orange-500 col-span-full text-center py-8">No se encontraron alumnos para el grupo ${groupName} en el CSV.</p>`;
                return;
            }

            filteredStudents.forEach(student => {
                const card = document.createElement('div');
                card.className = "student-card bg-gray-50 border border-gray-200 rounded-lg p-4 text-center cursor-pointer hover:bg-blue-50 hover:border-blue-300 shadow-sm flex flex-col justify-between";
                card.innerHTML = `
                    <span class="font-medium text-gray-800 text-sm mb-2 pointer-events-none">${student.name}</span>
                    <span class="text-xs text-gray-500 bg-gray-200 rounded px-2 py-1 self-center pointer-events-none">Seleccionar</span>
                `;
                
                // Vincular evento de clic de manera robusta
                card.addEventListener('click', () => {
                    triggerStudentExit(student.name, groupName);
                });

                grid.appendChild(card);
            });
        }

        // --- ACCIONES DE SALIDA Y REGRESO ---
        function triggerStudentExit(studentName, groupName) {
            const teacherId = document.getElementById('teacherSelect').value;
            if (!teacherId) {
                alert("Por favor seleccione un docente o el Maestro Comodín primero.");
                return;
            }

            if (currentActiveStudent) {
                alert("⚠️ Ya hay un alumno fuera de clase. Debe registrar su regreso antes de que salga otro.");
                return;
            }

            const motivo = document.getElementById('motivoSelect').value;
            const now = new Date();
            const fechaStr = now.toLocaleDateString();
            const horaSalidaStr = now.toLocaleTimeString();

            let teacherName = "Maestro Comodín";
            if (teacherId !== "COMODIN") {
                let t = scheduleData.teachers.find(teach => teach.id === teacherId);
                if (t) teacherName = t.name;
            }

            const materiaText = document.getElementById('activeSubjectDisplay').textContent.replace("Materia: ", "");

            // 1. Enviar a Google Sheets vía Apps Script
            const payload = {
                action: "salida",
                alumno: studentName,
                grupo: groupName,
                materia: materiaText,
                docente: teacherName,
                motivo: motivo,
                fecha: fechaStr,
                horaSalida: horaSalidaStr
            };

            fetch(WEB_APP_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            }).catch(err => console.error("Error enviando a Sheets:", err));

            // 2. Actualizar Firebase (bloquea la salida de otros)
            db.ref('currentOut').set({
                student: studentName,
                group: groupName,
                motivo: motivo,
                horaSalida: horaSalidaStr,
                timestamp: Date.now()
            }).then(() => {
                console.log("Salida registrada en Firebase");
            }).catch(err => {
                alert("Error al conectar con Firebase. Verifique sus reglas de base de datos.");
                console.error(err);
            });
        }

        function registerReturn() {
            if (!currentActiveStudent) return;

            const now = new Date();
            const horaRegresoStr = now.toLocaleTimeString();

            const payload = {
                action: "regreso",
                alumno: currentActiveStudent.student,
                horaRegreso: horaRegresoStr
            };

            fetch(WEB_APP_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            }).catch(err => console.error("Error enviando regreso a Sheets:", err));

            // Limpiar Firebase
            db.ref('currentOut').remove().then(() => {
                console.log("Regreso registrado con éxito");
            });
        }

        // --- SINCRONIZACIÓN EN TIEMPO REAL CON FIREBASE ---
        function setupFirebaseListener() {
            const alertBox = document.getElementById('statusAlert');
            const studentSpan = document.getElementById('currentStudentOut');
            const motivoSpan = document.getElementById('currentMotivoOut');

            db.ref('currentOut').on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    currentActiveStudent = data;
                    studentSpan.textContent = `${data.student} (${data.group})`;
                    motivoSpan.textContent = data.motivo;
                    alertBox.classList.remove('hidden');
                } else {
                    currentActiveStudent = null;
                    alertBox.classList.add('hidden');
                }
            }, (error) => {
                console.error("Error en Firebase listener:", error);
            });
        }
    </script>
</body>
</html>
