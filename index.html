<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Baño y Enfermería</title>
    <!-- Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .student-card { transition: all 0.2s ease; }
        .student-card:hover { transform: translateY(-2px); }
    </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

    <div class="container mx-auto px-4 py-6 max-w-5xl">
        <!-- Encabezado -->
        <header class="bg-white shadow-md rounded-lg p-6 mb-6 flex flex-col md:flex-row justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-blue-900">Control de Baño y Enfermería</h1>
                <p class="text-sm text-gray-600">Colegio Pablo Guardado Chávez</p>
            </div>
            <div class="mt-4 md:mt-0 flex gap-2">
                <label class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded cursor-pointer text-sm font-medium shadow">
                    📁 Cargar JSON Horarios
                    <input type="file" id="jsonFileInput" accept=".json" class="hidden">
                </label>
                <label class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded cursor-pointer text-sm font-medium shadow">
                    📊 Cargar CSV Alumnos
                    <input type="file" id="csvFileInput" accept=".csv" class="hidden">
                </label>
            </div>
        </header>

        <!-- Panel de Configuración -->
        <div class="bg-white shadow-md rounded-lg p-6 mb-6 grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Docente:</label>
                <select id="teacherSelect" class="w-full border border-gray-300 rounded p-2 focus:ring focus:ring-blue-300">
                    <option value="">Seleccione docente...</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Grupo / Salón:</label>
                <select id="groupSelect" class="w-full border border-gray-300 rounded p-2 focus:ring focus:ring-blue-300">
                    <option value="">Seleccione grupo...</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Motivo de Salida:</label>
                <select id="motivoSelect" class="w-full border border-gray-300 rounded p-2 focus:ring focus:ring-blue-300">
                    <option value="Baño">Baño</option>
                    <option value="Enfermería">Enfermería</option>
                </select>
            </div>
        </div>

        <!-- Alerta de Alumno Fuera -->
        <div id="statusAlert" class="hidden bg-yellow-50 border-l-4 border-yellow-400 p-4 mb-6 rounded shadow-sm flex justify-between items-center">
            <div>
                <span class="font-bold text-yellow-800">⚠️ Alumno actualmente fuera:</span>
                <span id="currentStudentOut" class="text-yellow-900 font-semibold ml-2"></span>
                <span id="currentMotivoOut" class="text-xs bg-yellow-200 text-yellow-800 px-2 py-0.5 rounded ml-2"></span>
            </div>
            <button id="returnBtn" class="bg-yellow-600 hover:bg-yellow-700 text-white px-4 py-1.5 rounded text-sm font-medium shadow">
                Registrar Regreso
            </button>
        </div>

        <!-- Cuadrícula de Alumnos -->
        <div class="bg-white shadow-md rounded-lg p-6">
            <h2 class="text-lg font-bold text-gray-800 mb-4 flex justify-between items-center">
                <span>Listado de Alumnos del Grupo</span>
                <span id="activeSubjectDisplay" class="text-sm font-normal bg-blue-100 text-blue-800 px-3 py-1 rounded-full">Materia: -</span>
            </h2>
            <div id="studentsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
                <p class="text-gray-500 col-span-full text-center py-8">Cargue el JSON de horarios, el CSV de alumnos y seleccione un grupo para comenzar.</p>
            </div>
        </div>
    </div>

    <script>
        // URL DE TU WEB APP DE GOOGLE APPS SCRIPT
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycby5sOTFkGyZ1KhiAeu75bk0Pb3e9oyqdyeR5f3pRB_7NlNLrfg_0l7I7EdTxghE5riV/exec";

        let scheduleData = JSON.parse(localStorage.getItem('scheduleData')) || null;
        let studentsData = JSON.parse(localStorage.getItem('studentsData')) || [];
        let currentActiveStudent = JSON.parse(localStorage.getItem('currentActiveStudent')) || null;

        document.addEventListener('DOMContentLoaded', () => {
            if (scheduleData) initSelectors();
            updateAlertUI();

            document.getElementById('jsonFileInput').addEventListener('change', handleJSONUpload);
            document.getElementById('csvFileInput').addEventListener('change', handleCSVUpload);
            document.getElementById('groupSelect').addEventListener('change', renderStudents);
            document.getElementById('teacherSelect').addEventListener('change', updateContext);
            document.getElementById('returnBtn').addEventListener('click', registerReturn);
        });

        function handleJSONUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    scheduleData = JSON.parse(e.target.result);
                    localStorage.setItem('scheduleData', JSON.stringify(scheduleData));
                    alert("¡Horarios cargados con éxito!");
                    initSelectors();
                } catch (err) {
                    alert("Error al leer el archivo JSON.");
                }
            };
            reader.readAsText(file);
        }

        function handleCSVUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const lines = e.target.result.split(/\r\n|\n/);
                studentsData = [];
                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue;
                    const parts = line.split(',');
                    if (parts.length >= 2) {
                        studentsData.push({
                            name: parts[0].trim().replace(/^["']|["']$/g, ''),
                            group: parts[1].trim().replace(/^["']|["']$/g, '')
                        });
                    }
                }
                localStorage.setItem('studentsData', JSON.stringify(studentsData));
                alert(`¡Se cargaron ${studentsData.length} alumnos correctamente!`);
                renderStudents();
            };
            reader.readAsText(file);
        }

        function initSelectors() {
            if (!scheduleData) return;
            const teacherSelect = document.getElementById('teacherSelect');
            teacherSelect.innerHTML = '<option value="">Seleccione docente...</option>';
            
            let comodinOpt = document.createElement('option');
            comodinOpt.value = "COMODIN";
            comodinOpt.textContent = "⭐ MAESTRO COMODÍN (Actualización / Libre)";
            teacherSelect.appendChild(comodinOpt);

            let teachers = [...scheduleData.teachers].sort((a, b) => a.name.localeCompare(b.name));
            teachers.forEach(t => {
                let opt = document.createElement('option');
                opt.value = t.id;
                opt.textContent = t.name;
                teacherSelect.appendChild(opt);
            });

            const groupSelect = document.getElementById('groupSelect');
            groupSelect.innerHTML = '<option value="">Seleccione grupo...</option>';
            scheduleData.classes.forEach(c => {
                let opt = document.createElement('option');
                opt.value = c.name;
                opt.textContent = c.name;
                groupSelect.appendChild(opt);
            });
        }

        function updateContext() {
            if (document.getElementById('teacherSelect').value === "COMODIN") {
                document.getElementById('activeSubjectDisplay').textContent = "Materia: [Modo Comodín]";
            }
        }

        function renderStudents() {
            const groupName = document.getElementById('groupSelect').value;
            const grid = document.getElementById('studentsGrid');
            grid.innerHTML = '';

            if (!groupName) {
                grid.innerHTML = '<p class="text-gray-500 col-span-full text-center py-8">Seleccione un grupo.</p>';
                return;
            }

            if (studentsData.length === 0) {
                grid.innerHTML = '<p class="text-red-500 col-span-full text-center py-8">No hay alumnos cargados. Por favor cargue el archivo CSV.</p>';
                return;
            }

            const filtered = studentsData.filter(s => s.group === groupName);
            if (filtered.length === 0) {
                grid.innerHTML = `<p class="text-orange-500 col-span-full text-center py-8">No se encontraron alumnos para el grupo ${groupName}.</p>`;
                return;
            }

            filtered.forEach(student => {
                const card = document.createElement('div');
                card.className = "student-card bg-gray-50 border border-gray-200 rounded-lg p-4 text-center cursor-pointer hover:bg-blue-50 shadow-sm flex flex-col justify-between";
                card.innerHTML = `
                    <span class="font-medium text-gray-800 text-sm mb-2 pointer-events-none">${student.name}</span>
                    <span class="text-xs text-gray-500 bg-gray-200 rounded px-2 py-1 self-center pointer-events-none">Seleccionar</span>
                `;
                card.addEventListener('click', () => triggerExit(student.name, groupName));
                grid.appendChild(card);
            });
        }
function triggerExit(studentName, groupName) {
            const teacherId = document.getElementById('teacherSelect').value;
            if (!teacherId) {
                alert("Por favor seleccione un docente primero.");
                return;
            }

            if (currentActiveStudent) {
                alert(`⚠️ Ya hay un alumno fuera de clase (${currentActiveStudent.student}).`);
                return;
            }

            const motivo = document.getElementById('motivoSelect').value;
            const now = new Date();
            let teacherName = teacherId === "COMODIN" ? "Maestro Comodín" : scheduleData.teachers.find(t => t.id === teacherId)?.name || "Docente";

            const payload = {
                action: "salida",
                alumno: studentName,
                grupo: groupName,
                materia: document.getElementById('activeSubjectDisplay').textContent.replace("Materia: ", ""),
                docente: teacherName,
                motivo: motivo,
                fecha: now.toLocaleDateString(),
                horaSalida: now.toLocaleTimeString()
            };

            // Usamos un formulario invisible o una petición GET/POST codificada si fuera necesario, 
            // pero con no-cors aseguramos el envío por POST plano:
            fetch(WEB_APP_URL, {
                method: "POST",
                mode: "no-cors",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: JSON.stringify(payload)
            }).then(() => {
                currentActiveStudent = {
                    student: studentName,
                    group: groupName,
                    motivo: motivo,
                    horaSalida: now.toLocaleTimeString()
                };
                localStorage.setItem('currentActiveStudent', JSON.stringify(currentActiveStudent));
                updateAlertUI();
                alert(`Salida registrada para ${studentName}. Revisa tu hoja en unos segundos.`);
            }).catch(err => {
                console.error(err);
                alert("Error de red al registrar la salida.");
            });
        }



        
        function registerReturn() {
            if (!currentActiveStudent) return;

            const now = new Date();
            const payload = {
                action: "regreso",
                horaRegreso: now.toLocaleTimeString()
            };

            fetch(WEB_APP_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify(payload)
            }).then(() => {
                currentActiveStudent = null;
                localStorage.removeItem('currentActiveStudent');
                updateAlertUI();
                alert("Regreso registrado con éxito.");
            }).catch(err => {
                console.error(err);
                alert("Error al registrar el regreso.");
            });
        }

        function updateAlertUI() {
            const alertBox = document.getElementById('statusAlert');
            const studentSpan = document.getElementById('currentStudentOut');
            const motivoSpan = document.getElementById('currentMotivoOut');

            if (currentActiveStudent) {
                studentSpan.textContent = `${currentActiveStudent.student} (${currentActiveStudent.group})`;
                motivoSpan.textContent = currentActiveStudent.motivo;
                alertBox.classList.remove('hidden');
            } else {
                alertBox.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
